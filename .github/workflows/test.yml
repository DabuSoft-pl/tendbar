name: Test

# Pushes to main and pull requests; changes to documentation only skip it.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The same Xcode as local builds and, later, releases: an older SDK runs the app in compatibility mode on macOS 26+.
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Xcode
        run: xcodebuild -version
      - name: Tests
        run: make test
      - name: Build the app
        run: |
          brew install xcodegen
          xcodegen generate --quiet
          xcodebuild -project Tendbar.xcodeproj -scheme Tendbar -configuration Debug -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO -quiet build
