name: CodeQL

# Static analysis for security problems in the Swift code and in these workflows. Findings show under Security →
# Code scanning. Swift needs a real build, so it runs on the Xcode image like the tests.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            runner: xcode-27
            build-mode: manual
          - language: actions
            runner: ubuntu-latest
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build
        if: matrix.build-mode == 'manual'
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
        run: |
          brew install xcodegen
          xcodegen generate --quiet
          xcodebuild -project Tendbar.xcodeproj -scheme Tendbar -configuration Debug -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO -quiet build
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
