name: Release

# A tag v1.2.3 (matching MARKETING_VERSION in project.yml) builds a Developer ID signed, notarized DMG and puts it on
# a draft GitHub release, to be checked and published by hand.
#
# Secrets:
#   DEVELOPER_ID_P12           base64 of the "Developer ID Application" certificate with its private key (.p12)
#   DEVELOPER_ID_P12_PASSWORD  the password of that .p12
#   NOTARY_KEY_P8              base64 of the App Store Connect API key (AuthKey_XXXXXXXXXX.p8)
#   NOTARY_KEY_ID              its key id
#   NOTARY_ISSUER              its issuer id
# Variables:
#   TEAM_ID                    the Apple Developer team id
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # The same Xcode as local builds and the test workflow.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      TEAM_ID: ${{ vars.TEAM_ID }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: make test

      - name: Signing keychain
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        run: |
          brew install xcodegen
          make release

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/release/Tendbar-*.dmg build/release/Tendbar-*.dmg.sha256 \
            --draft --title "Tendbar ${GITHUB_REF_NAME#v}" --generate-notes

      - name: Clean up
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary.p8"
