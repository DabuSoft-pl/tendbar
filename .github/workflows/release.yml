name: Release

# A tag v1.2.3 (matching MARKETING_VERSION in project.yml) builds a Developer ID signed, notarized DMG and its Sparkle
# appcast and puts them on a draft GitHub release, to be checked and published by hand. Publishing it is what offers
# the update: the app reads the appcast of the latest published release.
#
# Secrets:
#   DEVELOPER_ID_P12           base64 of the "Developer ID Application" certificate with its private key (.p12)
#   DEVELOPER_ID_P12_PASSWORD  the password of that .p12
#   NOTARY_KEY_P8              base64 of the App Store Connect API key (AuthKey_XXXXXXXXXX.p8)
#   NOTARY_KEY_ID              its key id
#   NOTARY_ISSUER              its issuer id
#   SPARKLE_ED_KEY             the Sparkle private key (`generate_keys --account tendbar -x key.txt`, then its contents)
# Variables:
#   TEAM_ID                    the Apple Developer team id
#
# Releases are made locally (scripts/release.sh) and this workflow is disabled; the signing keys are not on GitHub.
# If it is ever turned on, keep the secrets in the protected "release" environment, not in the repository.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # The same Xcode as local builds and the test workflow.
    runs-on: xcode-27
    timeout-minutes: 60
    # Secrets live in this environment, so required reviewers can gate every run.
    environment: release
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      XCODEGEN_VERSION: 2.46.0
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
      TEAM_ID: ${{ vars.TEAM_ID }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The write token is only needed by gh, through GH_TOKEN; it does not stay in .git/config.
          persist-credentials: false

      - name: Tag on main
        # Only reviewed code gets signed: the tagged commit must already be on main.
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Tests
        run: make test

      - name: XcodeGen
        # A pinned release checked against a hash written here, not whatever Homebrew serves today.
        run: |
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Signing keychain
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
          printf '%s' "$SPARKLE_ED_KEY" > "$RUNNER_TEMP/sparkle.key"
          echo "SPARKLE_KEY_FILE=$RUNNER_TEMP/sparkle.key" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          GH_TOKEN: ${{ github.token }}
        run: make release

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/release/Tendbar-*.dmg build/release/Tendbar-*.dmg.sha256 \
            build/release/appcast.xml $(find build/release -maxdepth 1 -name '*.delta') \
            --draft --title "Tendbar ${GITHUB_REF_NAME#v}" --generate-notes

      - name: Clean up
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/sparkle.key"
