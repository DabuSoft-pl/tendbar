name: Secrets

# Every push and pull request: gitleaks reads the new commits for keys, tokens and passwords (the whole history on
# the first run of a branch). GitHub's own secret scanning and push protection run as well; this also catches
# generic secrets they skip. `# gitleaks:allow` on a line marks a value as public, like the Sparkle public key.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$file"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $file\$" | sha256sum --check
          tar -xzf "$file" gitleaks
      - name: Scan
        run: ./gitleaks git --redact --verbose --exit-code 1 .
