name: Secrets

# Every push and pull request: gitleaks reads the new commits for keys, tokens and passwords (the whole history on
# the first run of a branch). GitHub's own secret scanning and push protection run as well; this also catches
# generic secrets they skip. `# gitleaks:allow` on a line marks a value as public, like the Sparkle public key.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      # From the release's checksums file, written here so the download is checked against a reviewed value.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$file"
          echo "$GITLEAKS_SHA256  $file" | sha256sum --check
          tar -xzf "$file" gitleaks
      - name: Scan
        run: ./gitleaks git --redact --verbose --exit-code 1 .
