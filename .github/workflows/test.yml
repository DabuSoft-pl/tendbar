name: Test

# While the repository is private, macOS minutes count ten times against the plan: run on pull requests and by hand
# only, and skip changes to documentation. Once it is public, add `push: branches: [main]` back.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The same Xcode as local builds and, later, releases: an older SDK runs the app in compatibility mode on macOS 26+.
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: xcodebuild -version
      - name: Tests
        run: make test
      - name: Build the app
        run: |
          brew install xcodegen
          xcodegen generate --quiet
          xcodebuild -project Tendbar.xcodeproj -scheme Tendbar -configuration Debug -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO -quiet build
