name: Tendbar
options:
  bundleIdPrefix: pl.dabusoft
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.1.8"
    CURRENT_PROJECT_VERSION: "15"
    # Set by `BETA=<n> make release`; empty for a release.
    TENDBAR_BETA: ""
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    # Release builds run under the hardened runtime, as notarization requires, so `make install` already shows
    # what a notarized build can and cannot do. `make release` adds the Developer ID signature.
    Release:
      ENABLE_HARDENED_RUNTIME: YES
packages:
  TendbarKit:
    path: Packages/TendbarKit
  # Updates: the only network use of the app, and the user can turn it off.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  Tendbar:
    type: application
    platform: macOS
    sources:
      - Tendbar
    info:
      path: Tendbar/Info.plist
      properties:
        CFBundleDisplayName: Tendbar
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        TendbarBeta: "$(TENDBAR_BETA)"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, pl]
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSAppleEventsUsageDescription: Tendbar switches to the terminal tab a Claude Code session runs in.
        NSHumanReadableCopyright: "© 2026 Dabusoft. MIT License."
        # Sparkle: the feed is attached to every published GitHub release, the key checks each update's signature.
        SUFeedURL: https://github.com/DabuSoft-pl/tendbar/releases/latest/download/appcast.xml
        SUPublicEDKey: h5/Bz8dc5tBC9hV/zmnw3kgybQ90bAJE5aixyfJU+Xc= # gitleaks:allow (public half of the Sparkle key)
        SUVerifyUpdateBeforeExtraction: true
    settings:
      base:
        PRODUCT_NAME: Tendbar
        PRODUCT_BUNDLE_IDENTIFIER: pl.dabusoft.tendbar
        CODE_SIGN_ENTITLEMENTS: Tendbar/Tendbar.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: TendbarKit
        product: TendbarDomain
      - package: TendbarKit
        product: TendbarApplication
      - package: TendbarKit
        product: TendbarInfrastructure
      - package: Sparkle
        product: Sparkle
      - target: TendbarHook
        embed: true
        codeSign: true
        copy:
          destination: executables
  TendbarHook:
    type: tool
    platform: macOS
    sources:
      - TendbarHook
    settings:
      base:
        PRODUCT_NAME: tendbar-hook
        PRODUCT_BUNDLE_IDENTIFIER: pl.dabusoft.tendbar.hook
        SKIP_INSTALL: YES
        # An Info.plist inside the binary gives the helper a stable signing identifier.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
    dependencies:
      - package: TendbarKit
        product: TendbarDomain
      - package: TendbarKit
        product: TendbarInfrastructure
schemes:
  Tendbar:
    build:
      targets:
        Tendbar: all
